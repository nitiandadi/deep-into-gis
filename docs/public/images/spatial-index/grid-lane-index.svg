<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">车道中心线写入规则网格</title>
  <desc id="desc">弯曲车道中心线经过多个网格单元，查询圆覆盖相邻单元并得到三条候选车道。</desc>
  <rect width="1200" height="660" rx="28" fill="#0f172a"/>
  <text x="600" y="58" fill="#f8fafc" font-size="30" text-anchor="middle" font-family="sans-serif" font-weight="700">规则网格中的 Lane 候选索引</text>
  <g transform="translate(90 105)" stroke="#334155" stroke-width="2"><path d="M0 0H800M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800"/><path d="M0 0V500M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500M800 0V500"/></g>
  <g transform="translate(90 105)" fill="#14b8a6" fill-opacity=".14"><rect x="100" y="300" width="100" height="100"/><rect x="200" y="300" width="100" height="100"/><rect x="300" y="300" width="100" height="100"/><rect x="300" y="200" width="100" height="100"/><rect x="400" y="200" width="100" height="100"/><rect x="500" y="200" width="100" height="100"/><rect x="500" y="100" width="100" height="100"/><rect x="600" y="100" width="100" height="100"/><rect x="700" y="100" width="100" height="100"/></g>
  <path d="M145 500C260 465 330 490 430 405S615 305 720 270S795 210 860 165" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round"/>
  <path d="M125 560C250 520 350 545 465 455S650 370 820 350" fill="none" stroke="#818cf8" stroke-width="10" stroke-linecap="round"/>
  <path d="M230 155C340 190 405 185 505 150S690 120 830 135" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="630" cy="325" r="78" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 8"/><circle cx="630" cy="325" r="9" fill="#fff"/>
  <text x="630" y="430" fill="#fda4af" font-size="20" text-anchor="middle" font-family="sans-serif">车辆位置与搜索半径</text>
  <rect x="925" y="145" width="220" height="310" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <text x="1035" y="195" fill="#f8fafc" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">命中单元候选</text>
  <rect x="965" y="235" width="140" height="52" rx="10" fill="#0f766e"/><text x="1035" y="268" fill="#ccfbf1" font-size="20" text-anchor="middle" font-family="sans-serif">Lane 3</text>
  <rect x="965" y="310" width="140" height="52" rx="10" fill="#3730a3"/><text x="1035" y="343" fill="#e0e7ff" font-size="20" text-anchor="middle" font-family="sans-serif">Lane 7</text>
  <rect x="965" y="385" width="140" height="52" rx="10" fill="#92400e"/><text x="1035" y="418" fill="#fef3c7" font-size="20" text-anchor="middle" font-family="sans-serif">Lane 9</text>
  <text x="1035" y="505" fill="#94a3b8" font-size="18" text-anchor="middle" font-family="sans-serif">再计算距离、航向</text><text x="1035" y="535" fill="#94a3b8" font-size="18" text-anchor="middle" font-family="sans-serif">与车道通行规则</text>
</svg>
