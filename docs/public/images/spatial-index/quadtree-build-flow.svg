<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title description">
  <title id="title">四叉树点索引构建流程</title>
  <desc id="description">依次读取当前点，定位所属叶子，判断叶子是否已满。未满则插入并处理下一个点；已满则四等分叶子区域、重新分配已有点，然后返回定位步骤，重试同一个点。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#8fb0c5"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #e9f2f7; text-anchor: middle; }
      .title { font-size: 22px; font-weight: 700; }
      .box { fill: #1b3545; stroke: #7aa4b7; stroke-width: 1.5; }
      .decision { fill: #16483f; stroke: #5bc9ad; stroke-width: 1.8; }
      .line { fill: none; stroke: #8fb0c5; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #b4cbd9; }
    </style>
  </defs>
  <rect width="960" height="310" rx="16" fill="#101c27"/>
  <text class="title" x="480" y="38">四叉树构建：分裂后重试当前点</text>

  <rect class="box" x="38" y="72" width="162" height="62" rx="10"/>
  <text class="label" x="119" y="109">读取当前点</text>
  <path class="line" d="M200 103H249"/>

  <rect class="box" x="256" y="72" width="180" height="62" rx="10"/>
  <text class="label" x="346" y="109">定位所属叶子</text>
  <path class="line" d="M436 103H465"/>

  <polygon class="decision" points="555,59 645,103 555,147 465,103"/>
  <text class="label" x="555" y="109">叶子已满？</text>

  <path class="line" d="M645 103H746"/>
  <text class="small" x="692" y="88">否</text>
  <rect class="box" x="753" y="72" width="170" height="62" rx="10"/>
  <text class="label" x="838" y="98">插入当前点</text>
  <text class="small" x="838" y="120">然后处理下一个点</text>

  <path class="line" d="M555 147V190"/>
  <text class="small" x="577" y="171">是</text>
  <rect class="box" x="440" y="197" width="230" height="66" rx="10"/>
  <text class="label" x="555" y="224">分裂目标叶子</text>
  <text class="small" x="555" y="247">重新分配已有点</text>
  <path class="line" d="M440 230H346V141"/>
  <text class="small" x="240" y="236">同一个点重新定位</text>
</svg>
