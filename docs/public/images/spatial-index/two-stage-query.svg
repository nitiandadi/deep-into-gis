<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">空间查询的两阶段流程</title>
  <desc id="desc">全部要素经过空间索引粗过滤成为候选，再经过精确几何判断得到最终结果。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#94a3b8"/></marker></defs>
  <rect width="1200" height="500" rx="28" fill="#0f172a"/>
  <text x="600" y="56" fill="#f8fafc" font-size="30" text-anchor="middle" font-family="sans-serif" font-weight="700">空间查询 = 候选检索 + 精确复核</text>
  <rect x="55" y="135" width="250" height="230" rx="20" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <text x="180" y="180" fill="#e2e8f0" font-size="25" text-anchor="middle" font-family="sans-serif">全部空间对象</text><text x="180" y="235" fill="#94a3b8" font-size="19" text-anchor="middle" font-family="sans-serif">道路 / 地块 / 建筑</text><text x="180" y="283" fill="#f8fafc" font-size="42" text-anchor="middle" font-family="sans-serif" font-weight="700">1,000,000</text><text x="180" y="325" fill="#94a3b8" font-size="18" text-anchor="middle" font-family="sans-serif">完整几何通常很复杂</text>
  <line x1="305" y1="250" x2="435" y2="250" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="445" y="105" width="310" height="290" rx="20" fill="#134e4a" stroke="#2dd4bf" stroke-width="3"/>
  <text x="600" y="158" fill="#ccfbf1" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">第一阶段：粗过滤</text><text x="600" y="208" fill="#99f6e4" font-size="20" text-anchor="middle" font-family="sans-serif">网格 / MBR / R-Tree</text><text x="600" y="264" fill="#f8fafc" font-size="42" text-anchor="middle" font-family="sans-serif" font-weight="700">420 个候选</text><text x="600" y="316" fill="#99f6e4" font-size="18" text-anchor="middle" font-family="sans-serif">允许少量假阳性</text><text x="600" y="350" fill="#fbbf24" font-size="18" text-anchor="middle" font-family="sans-serif">不能产生假阴性</text>
  <line x1="755" y1="250" x2="885" y2="250" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="895" y="135" width="250" height="230" rx="20" fill="#312e81" stroke="#818cf8" stroke-width="3"/>
  <text x="1020" y="180" fill="#e0e7ff" font-size="25" text-anchor="middle" font-family="sans-serif">第二阶段：精确计算</text><text x="1020" y="230" fill="#c7d2fe" font-size="19" text-anchor="middle" font-family="sans-serif">Intersects / Distance</text><text x="1020" y="283" fill="#f8fafc" font-size="42" text-anchor="middle" font-family="sans-serif" font-weight="700">37 个结果</text><text x="1020" y="325" fill="#c7d2fe" font-size="18" text-anchor="middle" font-family="sans-serif">由真实几何与业务规则确认</text>
  <text x="600" y="455" fill="#94a3b8" font-size="20" text-anchor="middle" font-family="sans-serif">示意数量仅用于说明过滤过程</text>
</svg>
